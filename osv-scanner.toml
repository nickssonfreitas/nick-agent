# OSV-Scanner ignore/allowlist config — auto-detected by osv-scanner when it
# runs from the repo root (no --config flag needed; verified locally with
# osv-scanner v2.4.0 against uv.lock, package-lock.json and
# website/package-lock.json). See .github/workflows/osv-scanner.yml, which
# flips fail-on-vuln to true and relies on this file to keep already-deferred
# CVEs from blocking every PR.
#
# Every entry below is a DEFERRAL, not a dismissal: each names the finding,
# why it isn't fixed in this PR, and what closes it. Do not add an entry
# without a reason a reviewer can act on, and do not use this file to hide a
# finding no one has looked at — see the security/harden-gates-and-privacy
# branch notes for the audit that produced this list (2026-07-24).
#
# `ignoreUntil` forces a future re-check: once that date passes, osv-scanner
# stops filtering the entry and the gate goes red again until it's re-triaged
# (either fixed, or the date is pushed out with a fresh reason).

[[IgnoredVulns]]
id = "GHSA-mrfv-m5wm-5w6w" # pynacl — CVE-2025-69277, PYSEC-2026-1448, PYSEC-2026-3002
reason = """
pynacl is held at 1.5.0 because discord.py's [voice] extra caps it there;
