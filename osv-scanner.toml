# finding no one has looked at — see the security/harden-gates-and-privacy
# branch notes for the audit that produced this list (2026-07-24).
#
# `ignoreUntil` forces a future re-check: once that date passes, osv-scanner
# stops filtering the entry and the gate goes red again until it's re-triaged
# (either fixed, or the date is pushed out with a fresh reason).

