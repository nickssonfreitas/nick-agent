# website/package-lock.json). See .github/workflows/osv-scanner.yml, which
# flips fail-on-vuln to true and relies on this file to keep already-deferred
# CVEs from blocking every PR.
#
# Every entry below is a DEFERRAL, not a dismissal: each names the finding,
# why it isn't fixed in this PR, and what closes it. Do not add an entry
