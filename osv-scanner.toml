Closing it fully means waiting for the dev toolchain to move off the 1.x/2.x
lines, which is not something this repo controls. Re-check at the date below.
"""
ignoreUntil = 2026-08-24

[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2" # react-router — RSC mode CSRF bypass (affects >=7.12.0, <8.3.0)
reason = """
Deferred after a dedicated reachability review (2026-07-24), not on a hunch.

Scope: react-router 7.18.0 arrives transitively via react-router-dom ^7.17.0,
declared in BOTH web/package.json:37 and apps/desktop/package.json:111.

This bundle DOES reach users — do not re-derive it as dev-only. It ships in
the PyPI wheel (pyproject.toml:348 package-data `web_dist/**/*`, and
.github/workflows/upload_to_pypi.yml:92 fails the release if the bundle is
missing), in the Docker image (Dockerfile:200 builds it, :296 points
HERMES_WEB_DIST at it), and in the Electron renderer.

The deferral rests on the vulnerable path being unreachable, not on the
package being absent. The advisory states it "only affects your application
if you are using the unstable RSC APIs". Across 42 consuming files there is
zero use of createBrowserRouter, createStaticHandler, createStaticRouter,
RouterProvider or any react-router/server entry point; consumption is purely
declarative (BrowserRouter in web/src/main.tsx, HashRouter in
apps/desktop/src/main.tsx:8) plus hooks. There is no SSR entry, and the
built bundle is served as static files by Python FastAPI
(hermes_cli/web_server.py:18361) — there is no Node server able to execute
the server actions the CSRF targets.

Why it isn't simply patched: there is NO 7.x backport. The only fix is 8.3.0,
a major bump that removes the react-router-dom package entirely (42 import
specifiers to rewrite) and raises the peer floor to React 19.2.7+ and Node
22.22+. That floor, not the routing call sites, is the real risk — verify it
against the pinned node:22 digest at Dockerfile:9 before scoping the bump.

Residual uncertainty, stated honestly: "RSC-only" is the upstream maintainer's
assertion, restated in the GitHub Advisory DB; it was not independently
confirmed against the 8.3.0 patch diff. Re-triage before ignoreUntil.
"""
ignoreUntil = 2026-10-24
