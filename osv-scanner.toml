reason = """
Partially fixed here: the top-level package-lock.json entry was bumped
5.0.7 -> 5.0.8 (the patched release) as part of this change. What remains
are transitive 1.1.16 and 2.1.2 copies nested under dev-only tooling
(eslint, @eslint/*, @electron/asar, @electron/universal, glob, filelist,
