#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - network_mode: host is intentional, not a default we forgot to
#     harden: the dashboard's gateway-liveness detection needs a shared
#     PID/network namespace with the gateway process, and the dashboard
#     reaches the gateway's loopback-bound API/health port directly this
#     way, with no published bridge ports. See
#     website/docs/user-guide/docker.md ("Running the dashboard") before
#     switching either service to bridge networking.
#   - The gateway's API server is off unless API_SERVER_ENABLED=true is
#     set in the mounted ~/.hermes/.env (the app itself then refuses to
#     start the API server without a strong API_SERVER_KEY — see
#     gateway/platforms/api_server.py's startup guard). The
#     API_SERVER_HOST / API_SERVER_KEY lines below are commented out by
#     default so a bare `docker compose up` never touches the API
#     surface; uncomment them only to source the key from this shell's
#     environment instead of writing it into ~/.hermes/.env, or to widen
#     the bind beyond the default loopback-only host. Because
#     network_mode: host removes the usual bridge-network NAT boundary,
#     API_SERVER_HOST=0.0.0.0 here really does reach every interface on
#     the host, not just the container — see
#     docs/user-guide/features/api-server.md before doing this on an
#     internet-facing host. When you do uncomment, API_SERVER_KEY uses
#     the `${VAR:?message}` form so compose refuses to start rather than
#     silently launching with an empty key.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # API server: opt in via API_SERVER_ENABLED=true in ~/.hermes/.env.
      # These two lines are only needed if you ALSO want to widen the bind
      # or source the key from this shell instead of ~/.hermes/.env; leave
      # them commented for the default loopback-only, messaging-only setup.
      # ⚠️ SECURITY: with network_mode: host, API_SERVER_HOST=0.0.0.0 below
      # exposes the API server (full terminal-capable agent access) on
      # every interface of the host, not just the container. Uncomment
      # only on a trusted network, behind a firewall/reverse-proxy auth
      # layer, or after reading docs/user-guide/features/api-server.md.
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY:?set API_SERVER_KEY in your shell or .env before enabling the API server}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Localhost-only. For remote access, tunnel via `ssh -L 9119:localhost:9119`.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
