name: Deploy VPS

# Rolls a pinned image digest onto the hardened VPS bundle
# (deploy/vps-hardened/), verifies the result against the security checklist,
# and rolls back automatically if the checklist fails.
#
# Two ways in:
#   - `workflow_call` from cd.yml — the continuous path, main pushes deploy.
#     The caller hands over a digest it just built and tested, so there is no
#     tag to resolve and no window where the tag could move underneath us.
#   - `workflow_dispatch` — the manual path, for rolling a specific tag or for
#     a dry run against what is already live.
#
# This deploy touches a box holding plaintext conversation history and live
# provider credentials. Continuous does not mean unguarded: the image only
# exists because tests/docker/ passed against those exact bytes, the checklist
# gates the result, and a failed check rolls back without asking. If you want a
# human in the loop as well, add required reviewers to the `production`
# environment — the run then pauses there instead of proceeding.
#
# What this workflow deliberately does NOT do:
#   - It does not create provider credentials. `hermes login` runs once, by
#     hand, inside the container (wiki/operations/vps-bootstrap.md step 5) so keys never land in
#     `docker inspect` or a CI log.
#   - It does not take a Hostinger snapshot. Hostinger keeps one snapshot per
#     VM and creating one destroys the previous; restoring reverts the whole
#     disk and loses conversations. Rollback here is "re-pin the previous
#     digest", which is surgical. See deploy/vps-hardened/hostinger-api.sh.
#   - It does not touch the Caddyfile or .env. Those hold the auth boundary and
#     are changed by a human who then re-runs the checklist.
#
# checkov:skip=CKV_GHA_7:O deploy e manual por desenho (ver o cabecalho acima), e
# `image_tag` e exatamente o que o operador precisa escolher: qual release rolar.
# O input chega via `env: IMAGE_TAG`, nunca interpolado em bloco run:, e a tag e
# resolvida para um digest antes de qualquer coisa tocar o host. O job roda sob
# `environment: production`, entao um segundo par de olhos aprova cada execucao.
# Zerar os inputs deixaria o workflow sem como escolher o que deployar.

on:
  workflow_call:
    inputs:
      image_digest:
        description: 'Immutable digest to deploy (sha256:...), produced by publish-image.yml'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy, resolved to a digest (e.g. sha-98a2b62)'
        required: true
        type: string
      dry_run:
        description: 'Resolve the digest and run the checklist against what is live, but do not deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Resolving a tag to a digest reads the GHCR package. Public packages need no
  # auth, but this keeps the workflow working if you keep the image private.
  packages: read

# Never cancel a deploy in flight: a half-applied digest swap with the
# containers down is the one state worse than either version.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  # This fork's own image, not upstream's. The fork carries code-layer security
  # fixes (CSP in hermes_cli/web_server.py, the credential-mode clamp in
  # hermes_cli/config.py) that the upstream image does not have, and the deployment page's
  # posture assumes they are present. Built by publish-image.yml.
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check required secrets are present
        # Fail here with a readable message rather than 40 lines later with an
        # ssh error that looks like a network problem.
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          DOMAIN: ${{ secrets.HERMES_DOMAIN }}
        run: |
          set -euo pipefail
          missing=""
          for var in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS DOMAIN; do
            [ -n "${!var:-}" ] || missing="${missing} ${var}"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):${missing} — see wiki/operations/vps-bootstrap.md"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the digest to deploy
        id: resolve
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          # Called from cd.yml: the caller already has a digest for the image it
          # just built and tested. Taking it verbatim closes the window where a
          # tag could be repointed between the build and this resolution.
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            digest="$IMAGE_DIGEST"
          else
            # Dispatched by hand: a tag is mutable and the compose file must
            # never carry one. Resolve it once, pass only the digest downstream.
            digest="$(docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}" \
              --format '{{ .Manifest.Digest }}')"
          fi
          case "$digest" in
            sha256:*) [ "${#digest}" -eq 71 ] || { echo "::error::malformed digest: ${digest}"; exit 1; } ;;
            *) echo "::error::could not resolve a digest for ${IMAGE_REPO}:${IMAGE_TAG:-<none>}"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${IMAGE_REPO}:${IMAGE_TAG} -> ${digest}"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys, never StrictHostKeyChecking=no. Without this the
          # runner would accept whatever answers on that IP, which turns a DNS
          # or BGP hiccup into "we handed the deploy key to a stranger".
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Record the currently deployed digest
        id: previous
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          previous="$(ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" 'bash -s -- current' \
            < deploy/vps-hardened/remote-deploy.sh)"
          echo "digest=${previous}" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: ${previous}"

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          # The script is piped from this checkout rather than run from a copy
          # on the VPS, so the deploy logic is always the reviewed one.
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- deploy '${DIGEST}'" \
            < deploy/vps-hardened/remote-deploy.sh

      - name: Verify — public surface (from outside the VPS)
        id: verify_public
        env:
          DOMAIN: ${{ secrets.HERMES_DOMAIN }}
        run: |
          set -euo pipefail
          # Runs on the runner on purpose: checks 1 and 2 model an anonymous
          # internet client, which is exactly what the runner is.
          bash deploy/vps-hardened/verify.sh public "$DOMAIN"

      - name: Verify — container posture (on the VPS)
        id: verify_local
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" 'bash -s -- local' \
            < deploy/vps-hardened/verify.sh

      - name: Roll back
        # Fires when the deploy itself failed OR the checklist rejected the
        # result. A deploy that comes up healthy but serves the dashboard
        # unauthenticated is worse than one that never came up.
        if: ${{ failure() && !inputs.dry_run && steps.previous.outputs.digest != '' }}
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          PREVIOUS: ${{ steps.previous.outputs.digest }}
        run: |
          set -euo pipefail
          echo "::warning::deploy or verification failed — rolling back to ${PREVIOUS}"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- rollback '${PREVIOUS}'" \
            < deploy/vps-hardened/remote-deploy.sh
          echo "::error::rolled back to ${PREVIOUS}. The database was NOT restored — if the failed image migrated the schema, restore the pre-deploy backup by hand (see remote-deploy.sh)."

      - name: Re-verify after rollback
        if: ${{ failure() && !inputs.dry_run && steps.previous.outputs.digest != '' }}
        continue-on-error: true
        env:
          DOMAIN: ${{ secrets.HERMES_DOMAIN }}
        run: bash deploy/vps-hardened/verify.sh public "$DOMAIN"

      - name: Clean up SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Summary
        if: always()
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          PREVIOUS: ${{ steps.previous.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### VPS deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${IMAGE_TAG}\` |"
            echo "| Resolved digest | \`${DIGEST:-unresolved}\` |"
            echo "| Previous digest | \`${PREVIOUS:-unknown}\` |"
            echo "| Dry run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"
