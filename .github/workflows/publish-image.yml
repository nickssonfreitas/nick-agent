name: Publish Image (GHCR)

# Builds and publishes this fork's own container image to GHCR.
#
# Why this exists: `docker.yml` publishes `nousresearch/hermes-agent` and is
# gated to the upstream repository, so a fork publishes nothing. But this
# fork's code differs from upstream in ways the hardened VPS deploy depends on
# — the CSP work in hermes_cli/web_server.py and the credential-mode clamp in
# hermes_cli/config.py, among others. the deployment page's posture assumes those
# code-layer fixes are present; deploying the upstream image would give you the
# hardened configuration wrapped around unhardened code, and verify.sh check 6
# would fail on it.
#
# Deliberate triggers only — no build on every push. An image that will run on
# a box holding conversation history and live provider credentials should be
# built because someone decided to, matching deploy-vps.yml being dispatch-only.
#
# Two architectures (amd64 + arm64), restoring upstream's push-by-digest +
# manifest-merge shape from docker.yml. This file used to build amd64 only, on
# the rationale that "Hostinger's KVM VPS is x86_64" — an architecture decision
# derived from a provider that had never been compared against alternatives.
# wiki/research/0001-vps-hosting-brazil.md did that comparison: the cheapest
# hardware that fits this deploy is Ampere (Oracle's São Paulo free tier), and
# an amd64-only pipeline made that option unreachable. Note the comparison also
# found that *paid* ARM is no longer cheaper at Hetzner, so arm64 earns its
# build minutes only if you actually deploy to an Ampere box.
#
# Each leg builds on a native runner rather than under QEMU, because the docker
# integration suite runs against the image before it is pushed and emulated
# execution would be both slow and a different thing than what ships.
#
# checkov:skip=CKV_GHA_7:`extra_tag` so acrescenta um rotulo a mais na imagem;
# `sha-<short>` e publicado sempre e nao depende de input, entao a procedencia
# do artefato nao vem do parametro. O valor chega via `env: EXTRA_TAG`, nunca
# interpolado em bloco run:, e o disparo exige write no repo. Mesma decisao
# aplicada em deploy-vps.yml, deploy-site.yml e upload_to_pypi.yml.

on:
  workflow_call:
    inputs:
      extra_tag:
        description: 'Optional additional tag to publish. sha-<short> is always published.'
        required: false
        type: string
    outputs:
      digest:
        description: 'Digest of the published manifest — feed this straight to deploy-vps.yml'
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: 'The sha-<short> tag published for this commit'
        value: ${{ jobs.publish.outputs.tag }}
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Optional additional tag to publish (e.g. staging). sha-<short> is always published.'
        required: false
        type: string
  release:
    types: [published]

# Gated off the upstream repo so this file is inert if it ever travels there in
# a PR. docker.yml uses the mirror-image guard.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  # Derived, not hardcoded: any fork of this fork publishes to its own
  # namespace without editing the file. GHCR requires lowercase, which
  # github.repository already is for this owner/name pair.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # One leg per architecture. Each builds, loads into its own daemon, runs the
  # docker integration suite against those exact bytes, then pushes BY DIGEST
  # with no tag. The publish job below stitches the digests into one tagged
  # manifest list. Splitting it this way is what lets the tests run natively:
  # a multi-arch `load: true` is not a thing docker supports.
  # ---------------------------------------------------------------------------
  build:
    if: github.repository_owner != 'NousResearch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build and load into the local daemon first, so the integration suite
      # runs against the exact bytes that get pushed. Pushing first and testing
      # after would publish a broken image and then tell you about it.
      - name: Build image (${{ matrix.arch }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.arch }}

      - name: Install uv (for docker tests)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0

      - name: Set up Python 3.11 (for docker tests)
        run: uv python install 3.11

      - name: Install Python dependencies (for docker tests)
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Run docker integration tests against the built image
        # The gate that makes publishing safe. HERMES_TEST_IMAGE short-circuits
        # the fixture's rebuild (tests/docker/conftest.py) so this reuses the
        # image already in the daemon rather than building a second 5GB copy.
        env:
          HERMES_TEST_IMAGE: ${{ env.IMAGE_NAME }}:test
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: scripts/run_tests.sh tests/docker/ --file-timeout 600

      - name: Log in to GHCR
        # GITHUB_TOKEN, scoped by `packages: write` above. No PAT, no new secret.
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only (no tag). The publish job assembles the tagged
      # manifest list; this is docker's recommended pattern for multi-runner
      # multi-platform builds.
      - name: Push ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Every layer is already in the gha cache from the build step above,
          # so this is a push, not a rebuild.
          cache-from: type=gha,scope=publish-${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Registry-side manifest assembly. No building, no layer re-push, ~30s.
  # ---------------------------------------------------------------------------
  publish:
    if: github.repository_owner != 'NousResearch'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The MANIFEST LIST digest, not a per-arch one. This is what
      # deploy/vps-hardened pins and what `imagetools inspect` reports as the
      # top-level digest, so a pinned deploy resolves to the right arch on the
      # box rather than to whichever leg happened to finish last.
      digest: ${{ steps.manifest.outputs.digest }}
      tag: ${{ steps.tags.outputs.short }}
    steps:
      - name: Compute tags
        id: tags
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          short="sha-${GITHUB_SHA:0:7}"
          # sha-<short> is the tag you actually deploy: it names one commit, so
          # a rollback target stays meaningful months later. The moving tags
          # below are for humans reading the package page.
          tags="${IMAGE_NAME}:${short}"
          if [ -n "${RELEASE_TAG:-}" ]; then
            tags="${tags},${IMAGE_NAME}:${RELEASE_TAG}"
          else
            branch="${GITHUB_REF_NAME//\//-}"
            tags="${tags},${IMAGE_NAME}:${branch}"
          fi
          if [ -n "${EXTRA_TAG:-}" ]; then
            tags="${tags},${IMAGE_NAME}:${EXTRA_TAG}"
          fi
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Will publish: ${tags}"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        # GITHUB_TOKEN, scoped by `packages: write` above. No PAT, no new secret.
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          sources=()
          for digest_file in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest_file}")
          done
          [ "${#sources[@]}" -gt 0 ] || { echo "::error::no digests to merge"; exit 1; }
          tag_args=()
          IFS=',' read -ra tag_list <<< "${TAGS}"
          for t in "${tag_list[@]}"; do
            tag_args+=(-t "${t}")
          done
          # Retry: registry API + just-pushed digest eventual consistency can
          # transiently fail the create; the operation is idempotent.
          for i in 1 2 3; do
            if docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::imagetools create failed after 3 attempts"
              exit 1
            fi
            echo "::warning::imagetools create failed (attempt $i); retrying in 20s"
            sleep 20
          done

      - name: Resolve manifest digest
        id: manifest
        env:
          SHORT: ${{ steps.tags.outputs.short }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${SHORT}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [ -n "${digest}" ] && [ "${digest}" != "null" ] \
            || { echo "::error::could not resolve manifest digest"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE_NAME}:${SHORT}"

      - name: Summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          SHORT: ${{ steps.tags.outputs.short }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Repository | \`${IMAGE_NAME}\` |"
            echo "| Deploy tag | \`${SHORT}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo "Deploy it:"
            echo ""
            echo '```bash'
            echo "gh workflow run deploy-vps.yml -f image_tag=${SHORT} -f dry_run=true"
            echo '```'
            echo ""
            echo "First publish only: check the package is public at"
            echo "<https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${GITHUB_REPOSITORY#*/}>,"
            echo "or give the VPS a read-only PAT (see wiki/operations/vps-bootstrap.md step 0b)."
          } >> "$GITHUB_STEP_SUMMARY"
